name: Build Windows portable package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing Release tag to upload the Windows package to'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Install failed" }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
      - name: Build portable package
        shell: pwsh
        run: .\scripts\build_windows.ps1 -Python (Get-Command python).Source
      - name: Test extracted application startup
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "Portable smoke test"
          Expand-Archive artifacts/PaperEdit2-Windows-x64.zip $destination -Force
          $folder = Join-Path $destination "PaperEdit2"
          $exe = Join-Path $folder "PaperEdit2.exe"
          $process = Start-Process -FilePath $exe -ArgumentList 'sample.pdf' -WorkingDirectory $folder -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) { throw "Application exited during startup: $($process.ExitCode)" }
          if ($process.MainWindowTitle -notlike 'sample.pdf*') { throw "PDF window did not open: $($process.MainWindowTitle)" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }
      - name: Test packaged PDF to Word conversion
        shell: pwsh
        run: |
          python scripts/check_packaged_conversion.py "${{ github.workspace }}\dist\PaperEdit2\PaperEdit2.exe"
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PaperEdit2-Windows-x64
          path: artifacts/PaperEdit2-Windows-x64.zip
          if-no-files-found: error

  publish-release:
    if: ${{ inputs.release_tag != '' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PaperEdit2-Windows-x64
          path: windows
      - name: Upload tested package to Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cd windows
          sha256sum PaperEdit2-Windows-x64.zip > SHA256SUMS-Windows.txt
          cat SHA256SUMS-Windows.txt
          gh release upload "$RELEASE_TAG" PaperEdit2-Windows-x64.zip SHA256SUMS-Windows.txt --repo "$GITHUB_REPOSITORY" --clobber
